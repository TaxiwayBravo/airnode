server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # The setup hotspot has no upstream internet, so captive-portal clients
    # must be able to open the local onboarding page over plain HTTP.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
    }
    # Safe fallback while the optional Tar1090 generator has no live feed.
    # The authenticated Your Sky live map uses the same readsb aircraft data.
    location = /tar1090/ {
        return 302 /#sky;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/airnode/tls/cert.pem;
    ssl_certificate_key /etc/airnode/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location = /tar1090/ { return 302 /#sky; }`r`n    # Tar1090 is AirNode's local, readsb-backed live map. The generated
    # include serves its assets and JSON data under /tar1090/.
    include /etc/nginx/snippets/airnode-tar1090.conf;
}
